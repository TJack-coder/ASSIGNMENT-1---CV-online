<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><?= htmlspecialchars($cv['full_name']) ?> - CV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Times New Roman', Times, serif; background: #f5f5f5; color: #000; }
        
        .cv-container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 300px 1fr;
        }

        .cv-sidebar {
            background: #f9f9f9;
            padding: 30px;
            border-right: 2px solid #333;
        }

        .cv-main { padding: 30px; }

        .sidebar-section { margin-bottom: 25px; }
        .sidebar-title {
            font-size: 1.1em;
            font-weight: bold;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .cv-name {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .cv-title {
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
        }

        .contact-item { margin: 8px 0; font-size: 0.9em; }

        .section-title {
            font-size: 1.2em;
            font-weight: bold;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin: 20px 0 15px 0;
            text-transform: uppercase;
        }

        .entry {
            margin-bottom: 18px;
            page-break-inside: avoid;
        }

        .entry-title { font-weight: bold; }
        .entry-subtitle { font-style: italic; color: #555; }
        .entry-date { font-size: 0.9em; color: #666; }
        .entry-description { margin-top: 6px; font-size: 0.95em; line-height: 1.5; }

        .skill-item { margin: 6px 0; font-size: 0.9em; }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        template-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 4px;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .cv-container { grid-template-columns: 1fr; }
            .cv-sidebar { border-right: none; border-bottom: 2px solid #333; }
        }
    </style>
</head>
<body>
    <a href="/employer/search" class="back-button">← Back</a>

    <div class="cv-container">
        <div class="cv-sidebar">
            <div class="cv-name"><?= htmlspecialchars($cv['full_name']) ?></div>
            <div class="cv-title"><?= htmlspecialchars($cv['category_name'] ?? '') ?></div>

            <div class="sidebar-section">
                <div class="sidebar-title">Contact</div>
                <div class="contact-item">📧 <?= htmlspecialchars($cv['email']) ?></div>
                <?php if (!empty($cv['phone_number'])): ?>
                    <div class="contact-item">📱 <?= htmlspecialchars($cv['phone_number']) ?></div>
                <?php endif; ?>
                <?php if (!empty($cv['country_name'])): ?>
                    <div class="contact-item">📍 <?= htmlspecialchars($cv['country_name']) ?></div>
                <?php endif; ?>
            </div>

            <?php if (!empty($cv['skills'])): ?>
                <div class="sidebar-section">
                    <div class="sidebar-title">Skills</div>
                    <?php foreach ($cv['skills'] as $skill): ?>
                        <div class="skill-item">
                            <strong><?= htmlspecialchars($skill['name']) ?></strong><br>
                            <small><?= htmlspecialchars($skill['proficiency']) ?></small>
                        </div>
                    <?php endforeach; ?>
                </div>
            <?php endif; ?>
        </div>

        <div class="cv-main">
            <?php if (!empty($cv['workHistory'])): ?>
                <h2 class="section-title">Experience</h2>
                <?php foreach ($cv['workHistory'] as $job): ?>
                    <div class="entry">
                        <div class="entry-title"><?= htmlspecialchars($job['job_title']) ?></div>
                        <div class="entry-subtitle"><?= htmlspecialchars($job['company_name']) ?></div>
                        <div class="entry-date"><?= htmlspecialchars($job['start_year'] . ' – ' . $job['end_year']) ?></div>
                        <?php if (!empty($job['description'])): ?>
                            <div class="entry-description"><?= htmlspecialchars($job['description']) ?></div>
                        <?php endif; ?>
                    </div>
                <?php endforeach; ?>
            <?php endif; ?>

            <?php if (!empty($cv['education'])): ?>
                <h2 class="section-title">Education</h2>
                <?php foreach ($cv['education'] as $edu): ?>
                    <div class="entry">
                        <div class="entry-title"><?= htmlspecialchars($edu['degree'] ?? '') ?></div>
                        <div class="entry-subtitle"><?= htmlspecialchars($edu['institution']) ?></div>
                        <div class="entry-date"><?= htmlspecialchars($edu['start_year'] . ' – ' . $edu['end_year']) ?></div>
                    </div>
                <?php endforeach; ?>
            <?php endif; ?>
        </div>
    </div>
</body>
</html>
